<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charts</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <nav>
    <h1>D3 Chart Dashboard</h1>
  </nav>
  <main>
    <section class="chart-grid" aria-label="Chart dashboard">
      <article class="chart-card">
        <h2>Energy Consumption vs. Star Rating</h2>
        <div class="chart-area" id="chart-1"></div>
      </article>
      <article class="chart-card">
        <h2>Energy Consumption for Different Screen Technologies Across All TVs Combined</h2>
        <div class="chart-area" id="chart-2"></div>
      </article>
      <article class="chart-card">
        <h2>Energy Consumption for Different Screen Technologies for 55-inch TVs Only</h2>
        <div class="chart-area" id="chart-3"></div>
      </article>
      <article class="chart-card">
        <h2>Average Spot Price by Year</h2>
        <div class="chart-area" id="chart-4"></div>
      </article>
    </section>
  </main>
  <script src="charts/scatter_plot.js"></script>
  <script src="charts/donut_chart.js"></script>
  <script src="charts/bar_chart.js"></script>
  <script src="charts/line_chart.js"></script>
  <script src="load_data.js"></script>
</body>
</html>
